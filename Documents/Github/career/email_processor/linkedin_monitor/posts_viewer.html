<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Post Monitor</title>
    <meta name="description" content="Monitor and filter scraped LinkedIn hiring posts by AI or email source.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080e1a;
            --panel: rgba(15, 25, 50, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --blue: #3b82f6;
            --violet: #8b5cf6;
            --green: #10b981;
            --text: #f1f5f9;
            --muted: #64748b;
            --row-hover: rgba(59, 130, 246, 0.07);
            --badge-ai: rgba(139, 92, 246, 0.2);
            --badge-ai-text: #c4b5fd;
            --badge-email: rgba(16, 185, 129, 0.2);
            --badge-email-text: #6ee7b7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-blobs {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.25;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .blob-1 { width: 600px; height: 600px; background: #3b82f6; top: -15%; left: -10%; }
        .blob-2 { width: 450px; height: 450px; background: #8b5cf6; bottom: -10%; right: -5%; animation-delay: -6s; }
        .blob-3 { width: 300px; height: 300px; background: #10b981; top: 50%; left: 40%; animation-delay: -3s; opacity: 0.15; }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.08); }
        }

        /* Header */
        header {
            position: relative; z-index: 10;
            background: rgba(8, 14, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex; align-items: center; gap: 14px;
        }
        .brand-dot {
            width: 10px; height: 10px; border-radius: 50%; background: var(--blue);
            box-shadow: 0 0 12px var(--blue);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
        header h1 span { 
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Main layout */
        main {
            position: relative; z-index: 1;
            max-width: 1200px; margin: 0 auto; padding: 32px 24px;
        }

        /* Controls bar */
        .controls {
            display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Toggle Switch */
        .toggle-group {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
        }
        .toggle-btn {
            padding: 8px 20px;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: auto;
            transform: none;
        }
        .toggle-btn:hover { background: transparent; color: var(--text); transform: none; }
        .toggle-btn.active-email {
            background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(16,185,129,0.1));
            color: #6ee7b7;
            box-shadow: 0 0 12px rgba(16,185,129,0.15);
        }
        .toggle-btn.active-ai {
            background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(139,92,246,0.1));
            color: #c4b5fd;
            box-shadow: 0 0 12px rgba(139,92,246,0.15);
        }
        .toggle-separator {
            width: 1px; height: 20px; background: var(--border);
        }

        /* Date filter */
        .date-group {
            display: flex; align-items: center; gap: 10px; flex: 1;
        }
        .date-label {
            font-size: 12px; font-weight: 500; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .date-input {
            padding: 9px 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            width: 130px;
        }
        .date-input:focus { border-color: var(--blue); }

        .fetch-btn {
            padding: 9px 20px;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            border: none; border-radius: 10px;
            color: white; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            display: flex; align-items: center; gap: 8px;
            min-width: auto;
        }
        .fetch-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .spinner {
            display: none; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fetch-btn.loading .spinner { display: block; }
        .fetch-btn.loading .btn-text { display: none; }

        /* Stats bar */
        .stats-bar {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 24px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px; color: var(--muted);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .stats-bar .count { color: var(--blue); font-weight: 700; font-size: 20px; }
        .stats-bar .mode-badge {
            margin-left: auto;
            padding: 4px 12px; border-radius: 20px;
            font-weight: 600; font-size: 12px;
        }
        .mode-badge.ai { background: var(--badge-ai); color: var(--badge-ai-text); }
        .mode-badge.email { background: var(--badge-email); color: var(--badge-email-text); }

        /* Table */
        .table-wrap {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 14px 18px;
            background: rgba(8, 14, 26, 0.6);
            font-size: 11px; text-transform: uppercase;
            color: var(--muted); font-weight: 600; letter-spacing: 0.8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        tbody tr {
            transition: background 0.15s ease;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--row-hover); }
        td { padding: 14px 18px; font-size: 13px; vertical-align: middle; }

        .author-cell { font-weight: 600; color: var(--text); }
        .author-cell small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
        
        .text-cell { color: var(--muted); max-width: 400px; }
        .text-cell p { 
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.5;
        }

        .source-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700; white-space: nowrap;
        }
        .source-badge.ai { background: var(--badge-ai); color: var(--badge-ai-text); }
        .source-badge.email { background: var(--badge-email); color: var(--badge-email-text); }

        .link-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            color: #60a5fa; font-size: 12px; font-weight: 500;
            text-decoration: none; cursor: pointer;
            transition: all 0.2s;
        }
        .link-btn:hover { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }

        .llm-scores {
            display: flex; gap: 5px; flex-wrap: wrap;
        }
        .score-chip {
            padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600;
        }
        .score-chip.pass { background: rgba(16,185,129,0.15); color: #6ee7b7; }
        .score-chip.fail { background: rgba(239,68,68,0.1); color: #fca5a5; }

        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--muted);
        }
        .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }

        .error-msg {
            margin-bottom: 16px;
            padding: 12px 18px; border-radius: 10px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #f87171; font-size: 13px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="brand-dot"></div>
        <h1>LinkedIn <span>Post Monitor</span></h1>
    </header>

    <main>
        <div class="controls">
            <!-- Toggle: AI vs Email -->
            <div class="toggle-group" id="modeToggle">
                <button class="toggle-btn active-email" id="btnEmail" onclick="setMode('email')">
                    📧 Email-Based
                </button>
                <div class="toggle-separator"></div>
                <button class="toggle-btn" id="btnAI" onclick="setMode('ai')">
                    🤖 AI Curated
                </button>
            </div>

            <!-- Date filter -->
            <div class="date-group">
                <span class="date-label">Date</span>
                <input type="text" id="dateInput" class="date-input" placeholder="19-08-26">
            </div>

            <!-- Fetch button -->
            <button id="fetchBtn" class="fetch-btn" onclick="fetchPosts()">
                <div class="spinner"></div>
                <span class="btn-text">Fetch Posts</span>
            </button>
        </div>

        <!-- Error message -->
        <div id="errorMsg" class="error-msg hidden"></div>

        <!-- Stats -->
        <div id="statsBar" class="stats-bar hidden">
            <div>
                <span class="count" id="countNum">0</span>
                <span> posts found</span>
            </div>
            <div id="modeBadge" class="mode-badge email">Email-Based</div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Author</th>
                        <th>Post Preview</th>
                        <th>Source</th>
                        <th>AI Scores</th>
                        <th>Slot</th>
                        <th>Link</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                                <h3>No posts loaded</h3>
                                <p>Select a date and click Fetch Posts</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // ── CONFIG ──────────────────────────────────────────────────────────────
        const SUPABASE_URL = 'https://ttopmizxefvflbouheyq.supabase.co';
        // Provide your anon public key here (safe to expose in browser)
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0b3BtaXp4ZWZ2Zmxib3VoZXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMTEzNjYsImV4cCI6MjA5OTY4NzM2Nn0.7oKTM9gWGHIH3CDAC0R5kjFp99v7NMAT8jsalgYcvUQ';
        // ────────────────────────────────────────────────────────────────────────

        let currentMode = 'email'; // 'email' or 'ai'

        // Auto-fill today's date
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yy = String(today.getFullYear()).slice(-2);
        document.getElementById('dateInput').value = `${dd}-${mm}-${yy}`;

        function setMode(mode) {
            currentMode = mode;
            const btnEmail = document.getElementById('btnEmail');
            const btnAI = document.getElementById('btnAI');
            btnEmail.className = 'toggle-btn' + (mode === 'email' ? ' active-email' : '');
            btnAI.className = 'toggle-btn' + (mode === 'ai' ? ' active-ai' : '');
        }

        async function fetchPosts() {
            const date = document.getElementById('dateInput').value.trim();
            const btn = document.getElementById('fetchBtn');
            const errorMsg = document.getElementById('errorMsg');
            const statsBar = document.getElementById('statsBar');

            if (!date) { showError('Please enter a date in DD-MM-YY format.'); return; }

            hideError();
            statsBar.classList.add('hidden');
            btn.classList.add('loading');
            btn.disabled = true;

            showLoadingRows();

            try {
                const isAI = currentMode === 'ai';
                // Query Supabase REST API with is_ai filter and date filter
                const url = `${SUPABASE_URL}/rest/v1/scraped_posts` +
                    `?select=author,text,url,emails,date,slot,is_ai,source,llm_evaluation` +
                    `&date=eq.${encodeURIComponent(date)}` +
                    `&is_ai=eq.${isAI}` +
                    `&order=id.desc`;

                const res = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Accept': 'application/json',
                    }
                });

                if (!res.ok) {
                    const errBody = await res.text();
                    throw new Error(`Supabase returned ${res.status}: ${errBody}`);
                }

                const posts = await res.json();
                renderTable(posts);

                // Update stats
                document.getElementById('countNum').textContent = posts.length;
                const badge = document.getElementById('modeBadge');
                if (currentMode === 'ai') {
                    badge.textContent = '🤖 AI Curated';
                    badge.className = 'mode-badge ai';
                } else {
                    badge.textContent = '📧 Email-Based';
                    badge.className = 'mode-badge email';
                }
                statsBar.classList.remove('hidden');

            } catch (e) {
                showError(`Failed to fetch: ${e.message}`);
                showEmptyState();
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function renderTable(posts) {
            const tbody = document.getElementById('tableBody');

            if (!posts || posts.length === 0) {
                showEmptyState(`No ${currentMode === 'ai' ? 'AI-curated' : 'email-based'} posts found for this date.`);
                return;
            }

            tbody.innerHTML = posts.map(post => {
                const isAI = post.is_ai;
                const author = escHtml(post.author || 'Unknown');
                const text = escHtml((post.text || '').slice(0, 280));
                const url = post.url || '#';
                const slot = post.slot || '—';
                const sourceBadge = isAI
                    ? `<span class="source-badge ai">🤖 AI</span>`
                    : `<span class="source-badge email">📧 Email</span>`;

                // LLM scores if available
                let llmHtml = '—';
                if (post.llm_evaluation && typeof post.llm_evaluation === 'object') {
                    const ev = post.llm_evaluation;
                    llmHtml = `<div class="llm-scores">
                        <span class="score-chip ${ev.Q1 ? 'pass' : 'fail'}">Q1:${ev.Q1 ? '✓' : '✗'}</span>
                        <span class="score-chip ${ev.Q2 ? 'pass' : 'fail'}">Q2:${ev.Q2 ? '✓' : '✗'}</span>
                        <span class="score-chip ${ev.Q3 ? 'pass' : 'fail'}">Q3:${ev.Q3 ? '✓' : '✗'}</span>
                    </div>`;
                }

                return `<tr>
                    <td class="author-cell">
                        ${author}
                        <small>${post.date || ''}</small>
                    </td>
                    <td class="text-cell"><p>${text}…</p></td>
                    <td>${sourceBadge}</td>
                    <td>${llmHtml}</td>
                    <td style="color:var(--muted);font-size:12px;">${slot}</td>
                    <td>
                        <a href="${url}" target="_blank" rel="noopener" class="link-btn">
                            ↗ Open
                        </a>
                    </td>
                </tr>`;
            }).join('');
        }

        function showLoadingRows() {
            document.getElementById('tableBody').innerHTML = `
                <tr><td colspan="6" style="text-align:center;padding:40px;">
                    <div style="display:inline-block;width:24px;height:24px;border:3px solid rgba(255,255,255,0.1);border-radius:50%;border-top-color:#3b82f6;animation:spin 0.8s linear infinite;"></div>
                </td></tr>`;
        }

        function showEmptyState(msg = 'No posts found.') {
            document.getElementById('tableBody').innerHTML = `
                <tr><td colspan="6">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <h3>${msg}</h3>
                        <p>Try a different date or switch modes</p>
                    </div>
                </td></tr>`;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() { document.getElementById('errorMsg').classList.add('hidden'); }

        function escHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
